<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صهيب أحمد — بورتفوليو</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Cairo', sans-serif;
      background: #0d0d0d;
      color: #fff;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: rgba(20, 20, 20, 0.9);
      border-bottom: 1px solid #222;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #ff4757;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      margin-right: 25px;
      transition: 0.3s;
    }

    nav a:hover {
      color: #ff4757;
    }

    .hero {
      text-align: center;
      padding: 100px 20px 60px;
    }

    .hero h1 {
      font-size: 48px;
      font-weight: 900;
    }

    .hero h1 span {
      color: #ff4757;
    }

    .hero p {
      color: #aaa;
      margin-top: 15px;
      font-size: 18px;
    }

    .sections {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
      padding: 40px;
      max-width: 1200px;
      margin: auto;
    }

    .card {
      background: #1a1a1a;
      border-radius: 16px;
      overflow: hidden;
      text-decoration: none;
      color: #fff;
      transition: transform 0.3s;
    }

    .card:hover {
      transform: translateY(-8px);
    }

    .card-img {
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
    }

    .red {
      background: linear-gradient(135deg, #ff4757, #c0392b);
    }

    .blue {
      background: linear-gradient(135deg, #3498db, #2c3e50);
    }

    .green {
      background: linear-gradient(135deg, #2ecc71, #27ae60);
    }

    .card-body {
      padding: 20px;
      text-align: center;
    }

    .card-body h3 {
      font-size: 22px;
    }

    .card-body p {
      color: #999;
      font-size: 14px;
      margin-top: 8px;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #777;
      border-top: 1px solid #222;
    }
  </style>
</head>

<body>
  <header>
    <div class="logo"> SOHIB AHMED</div>
    <nav>
      <a href="#work">PROJECTS</a>
      <a href="#contact"> CONTACT ME</a>
    </nav>
  </header>

  <section class="hero">
    <h1>مرحباً، أنا <span>SOHIB AHMED</span></h1>
    <p>مونتير فيديو — إعلانات • ريلز</p>
  </section>

  <section class="sections" id="work">
    <a href="ads.html" class="card">
      <div class="card-img red">🎬</div>
      <div class="card-body">
        <h3>COMMERCIALS</h3>
        <p>إعلانات احترافية للعلامات التجارية</p>
      </div>
    </a>
    <!-- <a href="motion.html" class="card">
    <div class="card-img blue">✨</div>
    <div class="card-body">
      <h3>Motion graphic</h3>
      <p>أنيميشن ورسوم متحركة إبداعية</p>
    </div>
  </a> -->
    <a href="reels.html" class="card">
      <div class="card-img green">📱</div>
      <div class="card-body">
        <h3>reels , shorts</h3>
        <p>محتوى قصير جذاب لمنصات السوشيال ميديا</p>
      </div>
    </a>
  </section>

  <footer id="contact">© 2026 صهيب احمد — جميع الحقوق محفوظة</footer>
</body>

</html>
